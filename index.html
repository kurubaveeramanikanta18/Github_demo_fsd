<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Functions</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>JavaScript Functions</h1>
        <script>
           function greet(){
            document.write("<h2>This is Fucntion decleration</h2>");
           }
           greet();
           const sum=function(a,b){
            return a+b;
           };
           console.log("Sum = ",sum(10,20));
           const mul=(a,b)=>{
            return a*b;
           };
           console.log("Product = ",mul(100,200));
        </script>
    </body>
</html>
